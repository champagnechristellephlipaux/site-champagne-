name: CI

# Contrôle qualité automatique : lint (JS + HTML) et vérification du format
# à chaque push et chaque pull request. Empêche toute régression de qualité.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run checks (ESLint + HTMLHint + Prettier)
        run: npm run check
